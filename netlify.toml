[build]
  command = "npm run install-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

[[redirects]]
  from = "/newhero"
  to = "https://newhero.netlify.app"
  status = 301
  force = true

  [[redirects]]
  from = "/mecanogame"
  to = "https://mecano-game.netlify.app"
  status = 301
  force = true


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
